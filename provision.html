<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Provision a workspace — ShyftRota</title>
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#0B0B0A">
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{--bg:#0B0B0A;--s1:#131210;--line:#2A2925;--line2:#1F1E1B;--text:#F4F1EC;--muted:#A3A09A;--faint:#8A867F;--accent:#E44E35;
--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;--sans:'Archivo',system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:620px;margin:0 auto;padding:40px 20px 72px}
a{color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:-.02em;margin-bottom:28px}
.brand svg{flex:none;border-radius:7px;background:#000}
.mk .w{stroke:#fff;fill:none;stroke-width:72;stroke-linejoin:miter;stroke-miterlimit:4}
.mk .r{stroke:var(--accent);fill:none;stroke-linecap:round}
.mk .cap{fill:#fff}.mk .dot{fill:var(--accent)}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--faint);text-transform:uppercase}
h1{font-size:32px;line-height:1.08;letter-spacing:-.03em;font-weight:800;margin:10px 0 8px}
.sub{color:var(--muted);margin:0 0 28px;font-size:15px}
.internal{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);border:1px solid rgba(228,78,53,.45);border-radius:3px;padding:3px 8px;margin-bottom:18px}
form{display:grid;gap:14px}
fieldset{border:1px solid var(--line);border-radius:10px;padding:18px;margin:0;display:grid;gap:14px;background:var(--s1)}
legend{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:0 8px}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
label .hint{font-weight:400;color:var(--faint);font-size:12px}
input,select{width:100%;min-height:46px;padding:10px 12px;background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--text);font:400 16px var(--sans)}
input:focus,select:focus{border-color:var(--accent);outline:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:460px){.two{grid-template-columns:1fr}}
button{min-height:50px;padding:0 20px;border-radius:6px;border:none;background:var(--accent);color:#0B0B0A;font:700 15px/1 var(--sans);cursor:pointer}
button:hover{background:#F0644C}
button[disabled]{background:#2A2523;color:var(--faint);cursor:not-allowed}
.msg{font-size:14px;min-height:20px;margin:0}
.msg.err{color:#F0A090}
.out{border:1px solid var(--line);border-left:2px solid #6FA36A;border-radius:8px;padding:20px;background:var(--s1);display:none;margin-top:22px}
.out.show{display:block}
.out h2{font-size:18px;margin:0 0 14px;letter-spacing:-.01em}
.cred{font-family:var(--mono);font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:14px;white-space:pre-wrap;word-break:break-word;margin:0 0 12px}
.copy{background:transparent;border:1px solid var(--line);color:var(--text);min-height:42px;font-size:13px;font-weight:600}
.copy:hover{border-color:var(--text);background:transparent}
.warn{color:#E3B65E;font-size:13px;margin:10px 0 0}
.note{color:var(--faint);font-size:13px;margin:12px 0 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <svg class="mk" viewBox="0 0 1254 1254" width="28" height="28" aria-hidden="true">
      <line class="r" x1="265" y1="279.5" x2="365" y2="279.5" stroke-width="19"></line>
      <path class="w" d="M513 421 H314 V573" stroke-linecap="butt"></path>
      <circle class="cap" cx="513" cy="421" r="36"></circle>
      <path class="w" d="M314 608 H513 V795 H314" stroke-linecap="round"></path>
      <path class="w" d="M772 831 V421 H936 V573" stroke-linecap="butt"></path>
      <path class="w" d="M790 608 H936" stroke-linecap="round"></path>
      <path class="r" d="M929 647 L880 792" stroke-width="72"></path>
      <circle class="dot" cx="991" cy="909" r="43"></circle>
    </svg>ShyftRota
  </div>

  <span class="internal">Internal · not linked from the site</span>
  <div class="eyebrow">New customer</div>
  <h1>Provision a workspace.</h1>
  <p class="sub">Creates the login, the property, the admin profile, four default shifts and a Front Desk department, then emails the credentials over. Takes about three seconds.</p>

  <form id="f" novalidate>
    <fieldset>
      <legend>Access</legend>
      <label for="secret">Provisioning secret
        <input id="secret" name="secret" type="password" autocomplete="off" required>
        <span class="hint">The PROVISION_SECRET from Vercel. Remembered until you close this tab.</span>
      </label>
    </fieldset>

    <fieldset>
      <legend>Property</legend>
      <label for="propertyName">Property or business name
        <input id="propertyName" name="propertyName" required maxlength="120" placeholder="Seaside Inn, Carlsbad">
      </label>
      <div class="two">
        <label for="roomCount">Rooms <span class="hint">optional</span>
          <input id="roomCount" name="roomCount" type="number" min="0" max="10000" inputmode="numeric" placeholder="259">
        </label>
        <label for="weekStart">Week starts on
          <select id="weekStart" name="weekStart"><option>Monday</option><option>Sunday</option></select>
        </label>
      </div>
    </fieldset>

    <fieldset>
      <legend>Their admin</legend>
      <label for="adminName">Full name
        <input id="adminName" name="adminName" required maxlength="120" autocomplete="off" placeholder="Dana Whitfield">
      </label>
      <label for="adminEmail">Work email
        <input id="adminEmail" name="adminEmail" type="email" required maxlength="200" autocomplete="off" placeholder="dana@seasideinn.com">
      </label>
      <label for="password">Password <span class="hint">leave blank to generate a strong one</span>
        <input id="password" name="password" type="text" autocomplete="off" minlength="8" maxlength="72">
      </label>
    </fieldset>

    <button type="submit" id="go">Create workspace</button>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
  </form>

  <section class="out" id="out" aria-live="polite">
    <h2 id="outTitle">Workspace created</h2>
    <p class="cred" id="cred"></p>
    <button type="button" class="copy" id="copy">Copy credentials</button>
    <p class="warn" id="warn" hidden></p>
    <p class="note" id="note"></p>
  </section>
</div>

<script>
(function(){
  var ENDPOINT = "https://app.shyftrota.com/api/provision-property";
  var f = document.getElementById("f");
  var msg = document.getElementById("msg");
  var go = document.getElementById("go");
  var out = document.getElementById("out");
  var cred = document.getElementById("cred");
  var warn = document.getElementById("warn");
  var note = document.getElementById("note");
  var secret = document.getElementById("secret");

  // Keep the secret for the tab's lifetime so back-to-back setups aren't painful.
  try { if (sessionStorage.getItem("sr_ps")) secret.value = sessionStorage.getItem("sr_ps"); } catch(e){}

  function say(t, err){ msg.textContent = t; msg.className = "msg" + (err ? " err" : ""); }

  f.addEventListener("submit", function(e){
    e.preventDefault();
    var d = Object.fromEntries(new FormData(f).entries());
    if (!d.secret || !d.propertyName.trim() || !d.adminName.trim() || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.adminEmail)) {
      say("Secret, property name, admin name and a valid email are all needed.", true); return;
    }
    try { sessionStorage.setItem("sr_ps", d.secret); } catch(err){}

    go.disabled = true; go.textContent = "Creating…"; say(""); out.classList.remove("show");

    fetch(ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-provision-secret": d.secret },
      body: JSON.stringify({
        propertyName: d.propertyName.trim(),
        roomCount: d.roomCount || null,
        weekStart: d.weekStart,
        adminName: d.adminName.trim(),
        adminEmail: d.adminEmail.trim(),
        password: d.password ? d.password : undefined
      })
    })
    .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ return { ok:r.ok, j:j }; }); })
    .then(function(res){
      go.disabled = false; go.textContent = "Create workspace";
      if (!res.ok || !res.j.ok) {
        say((res.j && res.j.error) || "That didn't work. Check the secret and try again.", true);
        if (res.j && res.j.hint) say(res.j.error + " — " + res.j.hint, true);
        return;
      }
      var j = res.j;
      var lines =
        "Property:  " + d.propertyName.trim() + "\n" +
        "Sign in:   https://app.shyftrota.com\n" +
        "Email:     " + j.adminEmail + "\n" +
        "Password:  " + (j.password || d.password);
      cred.textContent = lines;
      out.classList.add("show");
      note.textContent = j.emailed
        ? "Credentials emailed to " + j.adminEmail + ". Tell them to change the password under Settings."
        : "Email didn't send, so pass these on yourself.";
      if (j.warnings && j.warnings.length) {
        warn.hidden = false;
        warn.textContent = "Workspace is live, but couldn't seed " + j.warnings.join(" and ") + ". Add them by hand in the app.";
      } else { warn.hidden = true; }
      say("");
      f.reset();
      try { secret.value = sessionStorage.getItem("sr_ps") || ""; } catch(err){}
      out.scrollIntoView({ behavior:"smooth", block:"nearest" });
    })
    .catch(function(){
      go.disabled = false; go.textContent = "Create workspace";
      say("Couldn't reach the server. Check you're online and try again.", true);
    });
  });

  document.getElementById("copy").addEventListener("click", function(){
    var btn = this;
    navigator.clipboard.writeText(cred.textContent).then(function(){
      btn.textContent = "Copied"; setTimeout(function(){ btn.textContent = "Copy credentials"; }, 1800);
    }).catch(function(){
      var r = document.createRange(); r.selectNodeContents(cred);
      var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
      btn.textContent = "Selected — press copy";
    });
  });
})();
</script>
</body>
</html>
