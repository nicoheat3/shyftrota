<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ShyftRota">
  <title>ShyftRota</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Plus Jakarta Sans',sans-serif;background:#F8F6F3;}
    #root{min-height:100vh;}
    #splash{position:fixed;inset:0;background:#F8F6F3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;z-index:9999;}
    #splash-msg{font-size:13px;color:#999;letter-spacing:.03em;}
    .dots{display:flex;gap:8px;}
    .dot{width:8px;height:8px;border-radius:50%;background:#C84B31;animation:pulse 1.2s ease-in-out infinite;}
    .dot:nth-child(2){animation-delay:.2s;}
    .dot:nth-child(3){animation-delay:.4s;}
    @keyframes pulse{0%,80%,100%{opacity:.3;transform:scale(.8);}40%{opacity:1;transform:scale(1);}}
  </style>
</head>
<body>
  <div id="splash">
    <svg width="72" height="72" viewBox="0 0 1024 1024" style="border-radius:16px;">
      <rect width="1024" height="1024" fill="#1A1714"/>
      <rect x="175" y="185" width="170" height="36" rx="18" fill="#C84B31"/>
      <rect x="175" y="272" width="320" height="90" rx="45" fill="white"/>
      <rect x="405" y="272" width="90" height="190" fill="white"/>
      <rect x="175" y="372" width="320" height="90" fill="white"/>
      <rect x="175" y="462" width="90" height="93" fill="white"/>
      <rect x="175" y="585" width="320" height="90" rx="45" fill="white"/>
      <rect x="565" y="272" width="90" height="403" fill="white"/>
      <rect x="565" y="272" width="310" height="90" fill="white"/>
      <rect x="785" y="272" width="90" height="190" fill="white"/>
      <rect x="565" y="372" width="230" height="90" fill="white"/>
      <rect x="750" y="460" width="86" height="360" rx="43" fill="#C84B31" transform="rotate(20 793 640)"/>
      <circle cx="895" cy="820" r="48" fill="#C84B31"/>
    </svg>
    <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
    <div id="splash-msg">Loading ShyftRota...</div>
  </div>
  <div id="root"></div>

  <script>
    // Suppress Babel warning
    var _cw = console.warn;
    console.warn = function(m){ if(typeof m==='string' && m.indexOf('Babel')>-1) return; _cw.apply(console,arguments); };
    
    function hideSplash() {
      var s = document.getElementById('splash');
      s.style.transition = 'opacity 0.4s';
      s.style.opacity = '0';
      setTimeout(function(){ s.style.display='none'; }, 400);
    }

    function loadScript(src, cb) {
      var s = document.createElement('script');
      s.src = src;
      s.onload = cb;
      s.onerror = function(){ 
        document.getElementById('splash-msg').textContent = 'Load error. Check connection.';
      };
      document.head.appendChild(s);
    }

    // Load React → ReactDOM → Babel → App in sequence
    loadScript('https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js', function() {
      loadScript('https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js', function() {
        document.getElementById('splash-msg').textContent = 'Preparing app...';
        loadScript('https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js', function() {
          document.getElementById('splash-msg').textContent = 'Starting up...';
          // Fetch and compile the JSX
          fetch('ShyftRota.jsx')
            .then(function(r){ return r.text(); })
            .then(function(code) {
              try {
                var compiled = Babel.transform(code, { presets: ['react'] }).code;
                var script = document.createElement('script');
                script.textContent = compiled;
                document.head.appendChild(script);
                hideSplash();
              } catch(e) {
                document.getElementById('splash-msg').textContent = 'Error: ' + e.message;
                console.error(e);
              }
            })
            .catch(function(e){
              document.getElementById('splash-msg').textContent = 'Fetch error. Try refreshing.';
            });
        });
      });
    });
  </script>
</body>
</html>
